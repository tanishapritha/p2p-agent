[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "p2p-invoice-agent"
version = "0.1.0"
description = "Deterministic P2P invoice exception resolution with LLM-assisted extraction"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2", "pymupdf>=1.24,<2", "httpx>=0.27,<1",
  "python-multipart>=0.0.9", "langgraph>=0.2,<2", "streamlit>=1.38,<2",
  "requests>=2.32,<3", "pytesseract>=0.3.13,<1", "Pillow>=10,<13"
]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL", "live: requires a real LLM provider"]
[tool.ruff]
line-length = 100
target-version = "py311"
